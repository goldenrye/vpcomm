[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vpcomm"
version = "0.1.0"
description = "Self-hosted, end-to-end encrypted two-person audio prototype"
requires-python = ">=3.11"
dependencies = ["websockets>=15.0.1,<16", "cryptography>=46,<47"]

[project.optional-dependencies]
desktop = ["sounddevice>=0.5.3,<0.6"]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
vpcomm-server = "vpcomm.server:main"
vpcomm-desktop = "vpcomm.desktop:main"

[tool.setuptools.packages.find]
include = ["vpcomm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
